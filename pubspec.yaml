name: test_series
description: "Test Series & Online Course Learning App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2
  equatable: ^2.0.7
  rxdart: ^0.28.0
  go_router: ^14.8.1

  # Typography & Styling
  google_fonts: ^6.2.1

  # Networking & Caching
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5

  # Media & Viewers
  youtube_player_iframe: ^5.2.1
  flutter_pdfview: ^1.3.4
  open_filex: ^4.5.0

  # Payments & Device Integration
  razorpay_flutter: ^1.3.7
  share_plus: ^10.1.3
  image_picker: ^1.1.2

  # UI Components & Styling
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Firebase services (push, storage, analytics)
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  firebase_storage: ^12.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
